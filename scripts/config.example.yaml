# Agent Memory Beacon v0.7.0 — Configuration
# ===============================================
# Copy this file to config.yaml and fill in your paths.
# config.yaml is git-ignored and never committed.

version: "0.7.0"
product_id: "agent_memory_beacon"
agent: "codex"   # codex, claude, or zcode

# SessionStart scans all configured local agents. A hook may still pass
# --agent codex/claude/zcode to limit one Stop event to its own runtime.
transcript_agents: ["codex", "claude", "zcode"]

# --- REQUIRED PATHS ---

# Path to your Obsidian vault (created by setup.py if it doesn't exist)
vault_path: ""

# Codex on macOS stores JSONL transcripts under ~/.codex/sessions/YYYY/MM/DD/
codex_home: "~/.codex"
codex_sessions_path: "~/.codex/sessions"

# ZCode stores interactive sessions in SQLite message/part tables.
zcode_home: "~/.zcode"
zcode_db_path: "~/.zcode/cli/db/db.sqlite"

# Optional extra transcript roots. Each root may be a directory, JSONL file, or ZCode SQLite DB.
transcript_paths: []

# Path to Claude projects directory where session JSONL files live (optional)
claude_project_path: ""

# Path to Python 3 interpreter
python_path: "python3"

# Stable installed runtime used by Codex hooks and launchd after migration.
runtime_root: "~/.local/share/agent-memory-beacon/runtime"

# --- OPTIONAL PATHS ---

# Legacy single target; context_targets below is preferred.
claude_md_path: ""

# Files that receive the same compiled Decision/Error/Favor/Workflow memory.
# ZCode's current macOS build reads ~/.zcode/AGENTS.md as user instructions.
context_targets:
  - "~/.codex/AGENTS.md"
  - "~/.claude/CLAUDE.md"
  - "~/.zcode/AGENTS.md"

# Markdown memory output used by Codex/macOS before a native memory backend exists.
agent_memory_path: ""

# Visible Obsidian index rebuilt after each harvest. Empty = vault/00-Inbox/Agent Memory Index.md.
memory_index_path: ""

# Safe local Codex profile export for cross-account skills/plugins sync.
# Contains custom skills, shared AGENTS.md, safe plugin config, and manifests.
# Never stores auth.json, OAuth tokens, connector authorizations, sessions, or logs.
codex_profile_path: ""

# Check Codex profile drift on SessionStart. If another account is missing skills
# or plugin enablement, the hook prints a warning and suggested manual apply commands.
codex_profile_check_on_start: true

# Nutstore/backup sync path (optional — for backup.py cloud sync)
backup_path: ""

# Optional proxy health check. Leave empty to skip.
proxy:
  host:
  port:

# Project detection. Strings are matched against transcript text and cwd.
projects: []
project_keywords: {}

# Run the incremental scanner after SessionStart harvests missed transcripts.
# Set false if startup hooks need to be very fast.
scan_on_start: true

# macOS launchd fallback used when ZCode has no native Stop/SessionStart hooks.
harvest_interval_seconds: 300

# Bound one SessionStart/launchd batch so a large backlog cannot hold the
# harvester lock indefinitely. Remaining transcripts are retried next run.
harvest_start_max_transcripts: 32
harvest_start_time_budget_seconds: 180

# Verified multi-device transport. Keep disabled until both one-way Syncthing
# folders and this device's role are configured. Never synchronize the
# canonical Vault bidirectionally. Every non-empty path must expand to an
# absolute path. State, outbox, published, received, replica, inbox, attachment
# roots, and the canonical Vault must not be equal, nested, or aliases through
# symlinks.
beacon_sync:
  enabled: false
  role: ""  # macOS: authority; Windows: producer-replica
  device_id: ""  # required only for producer-replica
  state_dir: ""
  outbox_dir: ""
  published_dir: ""
  replica_path: ""
  received_published_dir: ""
  inboxes: []
  # Producer-only allowlist. Files are transported only when a transcript
  # explicitly references them; these directories are never scanned in bulk.
  attachment_roots: []
  # Authority example:
  # inboxes:
  #   - device_id: "windows-main"
  #     path: "~/AgentMemoryBeaconSync/inbox/windows-main"
  # Windows producer example:
  # attachment_roots:
  #   - "%USERPROFILE%/.codex/attachments"
  #   - "%USERPROFILE%/Downloads"
  max_chunk_bytes: 16777216
  max_gap_bytes: 536870912
  max_attachment_bytes: 33554432
  max_events_per_run: 32
  max_event_json_bytes: 131072
  max_object_bytes: 33554432
  max_replica_object_bytes: 67108864
  gc_retention_seconds: 604800

# Dynamic Codex memory refresh. The UserPromptSubmit hook remains installed
# when disabled and immediately returns an empty JSON object for quick rollback.
memory_runtime:
  enabled: true
  index_path: "05-Agent-Memory/recall-index.json"
  state_dir: "04-Feedback/_logs/recall-state"
  log_path: "04-Feedback/_logs/recall-hook.jsonl"
  hook_timeout_ms: 2000
  internal_deadline_ms: 1800
  stale_after_minutes: 30
  duplicate_suppression_minutes: 60
  topic_similarity_threshold: 0.25
  topic_min_terms: 3
  max_first_prompt: 8
  max_refresh: 6
  max_risk_or_error: 10
  token_budget: 1500

# Private, bounded checkpoint instructions for rolling conversation summaries.
# They are injected by the prompt hook only; harvesting and recall are separate.
conversation_summary:
  enabled: true
  min_substantive_messages: 5
  message_interval: 10
  stale_after_minutes: 30
  retry_interval_messages: 2
  max_summary_bytes: 4096
  max_recall: 1
  token_budget: 400

# Read-only Obsidian projection of the canonical memory graph. It creates
# visible Markdown nodes without changing formal memory or recall authority.
graph_projection:
  enabled: true
  output_dir: "03-Maps/_memory-nodes"
  max_nodes: 5000

# Privacy-safe evidence about whether recalled memory helped. Events contain
# only memory IDs/revisions, hashed sessions, trigger metadata, weak feedback
# signals, latency, and token estimates. Prompt and memory bodies are excluded.
memory_effectiveness:
  enabled: true
  event_log_path: "04-Feedback/_logs/memory-effectiveness.jsonl"
  report_path: "04-Feedback/memory-effectiveness.md"
  feedback_window_minutes: 15
  max_report_items: 100

# Candidate-only recommendations for moving repeated Decision/Error/Workflow
# memory into a stronger executable owner. This never edits source or memory.
memory_promotion:
  enabled: true
  proposal_dir: "04-Feedback/_promotion-proposals"
  min_source_count: 3
  min_exposure_count: 2
  max_proposals_per_run: 10

# Privacy defaults: track transcript fingerprints and redacted metadata only.
# Full normalized message archives require an explicit opt-in.
privacy:
  store_raw_transcripts: false
  store_transcript_metadata: true
  store_message_samples: false

# Personal memory judge. It keeps uncertain memories as candidates first, then
# promotes repeated/high-confidence items into 05-Agent-Memory/personal-memory.md.
personal_memory:
  enabled: true
  candidate_dir: "04-Feedback/_memory-candidates"
  formal_path: "05-Agent-Memory/personal-memory.md"
  candidate_threshold: 0.45
  direct_threshold: 0.85
  promote_seen_count: 2
  similarity_threshold: 0.5

# Adaptive skill preference learner. It watches explicit user skill calls such
# as $humanizer, $manual-memory-capture, $superpowers:systematic-debugging, or
# @pensive. First sightings become candidates; repeated similar scenes become
# Codex-readable routing rules.
skill_preferences:
  enabled: true
  candidate_dir: "04-Feedback/_skill-preferences"
  formal_path: "05-Agent-Memory/skill-routing-rules.md"
  promote_seen_count: 2
  similarity_threshold: 0.5
  initial_confidence: 0.58
  repeat_increment: 0.18

# Adaptive workflow memory. It learns repeated user corrections about how Codex
# should work, such as "inspect GitHub source before judging a plugin" or
# "after pensive finds fixable local code problems, continue with a verified fix."
workflow_memory:
  enabled: true
  candidate_dir: "04-Feedback/_workflow-candidates"
  formal_path: "05-Agent-Memory/workflow-rules.md"
  promote_seen_count: 2
  similarity_threshold: 0.5
  initial_confidence: 0.58
  repeat_increment: 0.18

# Generative Insight learner. A complete, source-grounded one-shot idea becomes
# a formal seed immediately. Repetition only reinforces it; candidates remain
# excluded from runtime recall.
insight_memory:
  enabled: true
  candidate_dir: "04-Feedback/_insight-candidates"
  formal_path: "05-Agent-Memory/insights.md"
  similarity_threshold: 0.58
  direct_seed_threshold: 0.72
  reinforce_source_count: 2
  max_auto_recall: 2
  recall_token_budget: 400

# Semantic quality gate for explicit DECISION and ERROR tags. Durable and
# complete tags become formal memory; uncertain tags are preserved here and
# high-confidence non-memory is rejected. Neither path enters runtime recall.
annotation_quality:
  enabled: true
  candidate_dir: "04-Feedback/_annotation-candidates"
  report_path: "04-Feedback/memory-quality-report.md"

# Transcript-derived failures remain audit-only candidates. They never enter
# formal ERROR memory or runtime recall; set enabled false to stop new writes.
error_evidence:
  enabled: true
  candidate_dir: "04-Feedback/_error-candidates"
  excerpt_limit: 500
  source_limit: 20

memory_lifecycle:
  proposal_dir: "04-Feedback/_lifecycle-proposals"
  audit_path: "05-Agent-Memory/lifecycle-audit.md"
  rollback_dir: "04-Feedback/_rollback/lifecycle"

# --- API CONFIGURATION (for LLM deep analysis in analyzer.py) ---

api:
  # Path to Claude settings.json (contains API key in env block)
  settings_json: ""

  # API key override (null = auto-read from settings.json env.ANTHROPIC_AUTH_TOKEN)
  key: null

  # API endpoint base URL (null = auto-detect from settings.json)
  base_url: null

  # Model name for deep analysis (null = auto-detect from settings.json)
  model: null

  temperature: 0.3
  max_tokens: 4000
  max_retries: 3
  retry_backoff_sec: [2, 4, 8]

# --- MACOS LAUNCHD SCANNER SCHEDULE ---

scan:
  day: SUN
  hour: 15
  minute: 0

# --- LOGGING ---

log_level: INFO
log_dir: ""    # auto-derived from vault_path/04-Feedback/_logs if empty
